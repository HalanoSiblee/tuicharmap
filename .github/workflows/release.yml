name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tuicharmap-linux-x86_64
          - os: macos-latest
            artifact_name: tuicharmap-macos-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- LINUX SETUP ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libncursesw5-dev libicu-dev

      # --- MACOS SETUP ---
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config ncurses icu4c
          # Force pkg-config to use Homebrew's modern ncurses and icu4c
          # (Handles both Apple Silicon /opt/homebrew and Intel /usr/local)
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/icu4c/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/ncurses/lib/pkgconfig:/usr/local/opt/ncurses/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/opt/homebrew/opt/icu4c/include -I/usr/local/opt/icu4c/include -I/opt/homebrew/opt/ncurses/include -I/usr/local/opt/ncurses/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/homebrew/opt/icu4c/lib -L/usr/local/opt/icu4c/lib -L/opt/homebrew/opt/ncurses/lib -L/usr/local/opt/ncurses/lib" >> "$GITHUB_ENV"

      # --- BUILD ---
      - name: Build
        run: make release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: tuicharmap
          if-no-files-found: error