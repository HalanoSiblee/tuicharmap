name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libncursesw5-dev libicu-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install pkg-config ncurses icu4c
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/icu4c/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/opt/homebrew/opt/icu4c/include -I/usr/local/opt/icu4c/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/homebrew/opt/icu4c/lib -L/usr/local/opt/icu4c/lib" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-icu

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make release

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make release

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp tuicharmap "release/tuicharmap-${{ matrix.name }}"
          ls -l release

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp tuicharmap.exe "release/tuicharmap-${{ matrix.name }}.exe"
          ls -l release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuicharmap-${{ matrix.name }}
          path: release/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
