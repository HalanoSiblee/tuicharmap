name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tuicharmap-linux-x86_64
          - os: macos-latest
            artifact_name: tuicharmap-macos-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libncursesw5-dev libicu-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config ncurses icu4c
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/icu4c/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/ncurses/lib/pkgconfig:/usr/local/opt/ncurses/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/opt/homebrew/opt/icu4c/include -I/usr/local/opt/icu4c/include -I/opt/homebrew/opt/ncurses/include -I/usr/local/opt/ncurses/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/homebrew/opt/icu4c/lib -L/usr/local/opt/icu4c/lib -L/opt/homebrew/opt/ncurses/lib -L/usr/local/opt/ncurses/lib" >> "$GITHUB_ENV"

      - name: Build
        run: make release

      - name: Rename Binary
        run: mv tuicharmap ${{ matrix.artifact_name }}

      # Corrected step for attaching files to the release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          fail_on_unmatched_files: true   # <-- Use this instead of if-no-files-found
